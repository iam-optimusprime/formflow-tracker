name: Release & Deploy

on:
    push:
        tags:
            - "v*"

jobs:
    release:
        runs-on: ubuntu-latest

        environment: production

        permissions:
            contents: read

        steps:
            ##################################################
            # Checkout
            ##################################################

            - name: Checkout Repository
              uses: actions/checkout@v4

            ##################################################
            # Docker Buildx
            ##################################################

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            ##################################################
            # Verify Docker Secrets
            ##################################################
            - name: Verify Docker Secrets
              env:
                  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

              run: |
                  echo "Checking Docker secrets..."

                  if [ -z "$DOCKER_USER" ]; then
                    echo "❌ DOCKERHUB_USERNAME is EMPTY"
                    exit 1
                  else
                    echo "✅ Username exists"
                    echo "Length: ${#DOCKER_USER}"
                  fi

                  if [ -z "$DOCKER_TOKEN" ]; then
                    echo "❌ DOCKERHUB_TOKEN is EMPTY"
                    exit 1
                  else
                    echo "✅ Token exists"
                    echo "Length: ${#DOCKER_TOKEN}"
                  fi

            ##################################################
            # Docker Login
            ##################################################

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            ##################################################
            # Backend Metadata
            ##################################################

            - name: Backend Docker Metadata
              id: backend-meta
              uses: docker/metadata-action@v5

              with:
                  images: osarietinmen/formflow-backend

                  tags: |
                      type=raw,value=${{ github.ref_name }}
                      type=raw,value=latest

            ##################################################
            # Frontend Metadata
            ##################################################

            - name: Frontend Docker Metadata
              id: frontend-meta
              uses: docker/metadata-action@v5

              with:
                  images: osarietinmen/formflow-frontend

                  tags: |
                      type=raw,value=${{ github.ref_name }}
                      type=raw,value=latest

            ##################################################
            # Build Backend
            ##################################################

            - name: Build & Push Backend
              uses: docker/build-push-action@v6

              with:
                  context: ./backend

                  push: true

                  tags: ${{ steps.backend-meta.outputs.tags }}

                  labels: ${{ steps.backend-meta.outputs.labels }}

                  cache-from: type=gha

                  cache-to: type=gha,mode=max

            ##################################################
            # Build Frontend
            ##################################################

            - name: Build & Push Frontend
              uses: docker/build-push-action@v6

              with:
                  context: ./frontend

                  push: true

                  tags: ${{ steps.frontend-meta.outputs.tags }}

                  labels: ${{ steps.frontend-meta.outputs.labels }}

                  cache-from: type=gha

                  cache-to: type=gha,mode=max

            ##################################################
            # Deploy
            ##################################################

            - name: Deploy to Azure VM

              uses: appleboy/ssh-action@v1.0.3

              with:
                  host: ${{ secrets.VM_HOST }}

                  username: ${{ secrets.VM_USERNAME }}

                  key: ${{ secrets.VM_SSH_KEY }}

                  script: |

                      cd ~/formflow-tracker

                      ./deployment/deploy.sh "${{ github.ref_name }}"

            ##################################################
            # Health Check
            ##################################################
            - name: Verify Deployment

              uses: appleboy/ssh-action@v1.0.3

              with:
                  host: ${{ secrets.VM_HOST }}

                  username: ${{ secrets.VM_USERNAME }}

                  key: ${{ secrets.VM_SSH_KEY }}

                  script: |

                      curl --fail http://localhost:5000/api/health

            ##################################################
            # Deployment Summary
            ##################################################

            - name: Deployment Summary
              run: |
                  echo "Deployment completed successfully."
