version: "3.9"

services:
    postgres:
        image: postgres:16-alpine
        container_name: formflow-db
        restart: unless-stopped

        environment:
            POSTGRES_USER: expenseuser
            POSTGRES_PASSWORD: expensepassword
            POSTGRES_DB: expense_tracker

        ports:
            - "5432:5432"

        volumes:
            - postgres-data:/var/lib/postgresql/data

        networks:
            - formflow-network

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U expenseuser"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: formflow-backend:latest
        container_name: formflow-backend
        restart: unless-stopped

        depends_on:
            postgres:
                condition: service_healthy

        environment:
            PORT: 5000
            DATABASE_URL: postgresql://expenseuser:expensepassword@postgres:5432/expense_tracker
            NODE_ENV: production

        ports:
            - "5000:5000"

        networks:
            - formflow-network

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        image: formflow-frontend:latest
        container_name: formflow-frontend
        restart: unless-stopped

        depends_on:
            - backend

        environment:
            NEXT_PUBLIC_API_URL: http://backend:5000
            NODE_ENV: production

        ports:
            - "3000:3000"

        networks:
            - formflow-network

volumes:
    postgres-data:

networks:
    formflow-network:
        driver: bridge
